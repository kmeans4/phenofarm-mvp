name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        env:
          # Build-only values; verification must not connect to live services.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/phenofarm_ci_build
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:3000
        run: AUTH_SECRET="$(openssl rand -hex 32)" npm run verify
